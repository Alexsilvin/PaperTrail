apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: papertrail
  namespace: papertrail
spec:
  ingressClassName: nginx
  rules:
    - host: papertrail.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: { name: api-gateway, port: { number: 80 } }
