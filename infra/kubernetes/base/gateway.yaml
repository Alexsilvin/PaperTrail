apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: papertrail
spec:
  replicas: 2
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      containers:
        - name: api-gateway
          image: papertrail/api-gateway:dev
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef: { name: papertrail-runtime }
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: papertrail
spec:
  selector: { app: api-gateway }
  ports:
    - port: 80
      targetPort: 8080
