services:
  api-gateway:
    build:
      context: ../../services/api-gateway
    ports: ["8080:8080"]
    environment:
      PORT: "8080"
      CORS_ORIGIN: "http://localhost:3000"
    depends_on: [rabbitmq]

  citizen-web:
    build:
      context: ../../apps/citizen-web
    ports: ["3000:80"]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-papertrail}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-papertrail-dev}
    ports: ["5672:5672", "15672:15672"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-papertrail-dev}
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-papertrail}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-papertrail-dev}
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
